name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Check formatting
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: false

      - name: Run tests with race detector
        run: go test -v -race -timeout 10m ./...

      - name: Fuzz ShardHeader codec
        run: go test -v -run=^$ -fuzz=FuzzShardHeader -fuzztime=30s ./internal/shard

      - name: Chaos in-process smoke test
        run: go test -v -race -run TestChaosSmoke ./cmd/chaos
